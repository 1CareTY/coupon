<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>好感 +5 券</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      font-family:
        "Comic Sans MS",
        "Microsoft YaHei",
        sans-serif;

      background:
        radial-gradient(circle at 20% 20%, #fff7d6 0 10%, transparent 11%),
        radial-gradient(circle at 80% 30%, #ffddea 0 10%, transparent 11%),
        #fff8f3;
    }

    .coupon {
      width: min(88vw, 390px);

      background: #fffdf8;

      border: 3px solid #403b3b;
      border-radius: 28px;

      padding: 34px 26px;

      text-align: center;

      box-shadow:
        8px 8px 0 #f7c9d8;

      transform: rotate(-1deg);

      position: relative;
      z-index: 2;
    }

    .tiny {
      font-size: 14px;
      color: #8d777d;
      letter-spacing: 2px;
    }

    h1 {
      margin: 14px 0 4px;

      font-size: 42px;

      color: #ef7797;

      text-shadow:
        2px 2px 0 #ffe0e8;
    }

    .plus {
      font-size: 65px;
      font-weight: bold;
      color: #ff668c;

      margin: 5px 0 10px;
    }

    .hearts {
      font-size: 27px;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    .description {
      line-height: 1.8;
      font-size: 16px;
      color: #5d5557;

      margin-bottom: 22px;
    }

    .coupon-info {
      text-align: left;

      border-top: 2px dashed #edb0c2;
      border-bottom: 2px dashed #edb0c2;

      padding: 15px 5px;
      margin-bottom: 22px;

      line-height: 1.8;

      font-size: 14px;
      color: #75676c;
    }

    button {
      width: 100%;

      border: 3px solid #403b3b;
      border-radius: 18px;

      background: #ff94ae;
      color: white;

      padding: 15px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        4px 4px 0 #403b3b;

      transition: 0.15s;
    }

    button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .rule {
      font-size: 12px;
      color: #aa969c;
      margin-top: 18px;
    }

    .doodle {
      position: absolute;
      font-size: 28px;
    }

    .d1 {
      left: -15px;
      top: 35px;
      transform: rotate(-15deg);
    }

    .d2 {
      right: -13px;
      bottom: 70px;
      transform: rotate(15deg);
    }

    .heart {
      position: fixed;

      font-size: 25px;

      pointer-events: none;

      animation: fly 1.4s ease-out forwards;

      z-index: 100;
    }

    @keyframes fly {
      0% {
        transform:
          translateY(0)
          scale(0.5)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translateY(-300px)
          scale(1.8)
          rotate(25deg);

        opacity: 0;
      }
    }

  </style>
</head>

<body>

<div class="coupon">

  <div class="doodle d1">🌷</div>
  <div class="doodle d2">⭐</div>

  <div class="tiny">
    GIRLFRIEND EXCLUSIVE COUPON
  </div>

  <h1>
    好感券
  </h1>

  <div class="plus">
    +5
  </div>

  <div class="hearts">
    ♡ ♡ ♡ ♡ ♡
  </div>

  <div class="description">

    恭喜获得一次好感度提升机会！

    <br>

    使用本券后，

    <br>

    男朋友好感度立即

    <strong> +5 </strong>

    💗

  </div>

  <div class="coupon-info">

    🎟 券号：LOVE-005

    <br>

    👧 使用人：女朋友本人

    <br>

    🔐 状态：未核销

    <br>

    ⏰ 有效期：永久

  </div>

  <button onclick="redeem()">
    💕 确认核销
  </button>

  <div class="rule">

    本券仅限本人使用 · 不可转让

    <br>

    可与撒娇、抱抱、亲亲叠加使用

    <br>

    最终解释权归女朋友所有

  </div>

</div>


<script>

  function redeem() {

    // 产生爱心动画
    for (let i = 0; i < 30; i++) {

      setTimeout(() => {

        const heart =
          document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
          ["💗", "💕", "💖", "🌸"][Math.floor(Math.random() * 4)];

        heart.style.left =
          Math.random() * 100 + "vw";

        heart.style.top =
          (60 + Math.random() * 30) + "vh";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1500);

      }, i * 35);

    }


    // 等动画播放一下，然后跳到核销表单
    setTimeout(() => {

      window.location.href =
        "你的Google表单链接";

    }, 1200);

  }

</script>

</body>
</html>
