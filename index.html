<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原谅券 · 好感+5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;

      font-family:
        "Comic Sans MS",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

      /* 不要粉底色，改成奶油白+浅米色 */
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 240, 190, 0.35) 0 8%, transparent 9%),
        radial-gradient(circle at 80% 25%, rgba(201, 223, 185, 0.28) 0 10%, transparent 11%),
        radial-gradient(circle at 70% 80%, rgba(255, 245, 215, 0.28) 0 8%, transparent 9%),
        #f8f6ef;
    }

    .coupon {
      width: min(92vw, 430px);
      position: relative;
      z-index: 2;

      background: #fffdf8;
      border: 3px solid #7f9771;
      border-radius: 28px;
      padding: 32px 24px 24px;
      text-align: center;

      box-shadow: 8px 8px 0 rgba(180, 194, 159, 0.55);
      transform: rotate(-1deg);
    }

    .coupon::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed #9fb28c;
      border-radius: 20px;
      pointer-events: none;
    }

    .tiny {
      font-size: 13px;
      color: #7f8d74;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .title {
      margin: 8px 0 10px;
      font-size: 44px;
      line-height: 1.1;
      color: #5f7b46;
      font-weight: 800;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: #f6f5e9;
      border: 2px dashed #9fb28c;
      border-radius: 999px;
      color: #725133;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .ribbon {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 18px;
      background: #dfe8cf;
      color: #6a4d33;
      border: 2px solid #9fb28c;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .description {
      font-size: 15px;
      line-height: 1.85;
      color: #5f5a53;
      margin: 0 0 18px;
      position: relative;
      z-index: 1;
    }

    .info-box {
      background: #fcfbf6;
      border: 2px dashed #b7c7a7;
      border-radius: 18px;
      padding: 14px 16px;
      text-align: left;
      line-height: 1.9;
      color: #675b4d;
      font-size: 14px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .note-box {
      background: #fdfcf7;
      border: 2px dashed #b7c7a7;
      border-radius: 16px;
      padding: 10px 14px;
      color: #6b5b49;
      font-size: 14px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    button {
      width: 100%;
      border: 3px solid #7f9771;
      border-radius: 18px;
      background: #a9c18b;
      color: #fffdf8;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 4px 4px 0 #7f9771;
      transition: 0.15s ease;
      position: relative;
      z-index: 1;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .rule {
      margin-top: 16px;
      color: #8c857b;
      font-size: 12px;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    /* 装饰元素 */
    .doodle {
      position: absolute;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    .bow {
      top: 18px;
      left: 18px;
      font-size: 28px;
      transform: rotate(-8deg);
    }

    .star1 {
      top: 68px;
      right: 72px;
      font-size: 22px;
    }

    .star2 {
      top: 150px;
      left: 28px;
      font-size: 18px;
    }

    .star3 {
      right: 30px;
      bottom: 130px;
      font-size: 20px;
    }

    .flower1 {
      top: 48px;
      left: 96px;
      font-size: 18px;
    }

    .flower2 {
      right: 26px;
      top: 210px;
      font-size: 18px;
    }

    .leaf1 {
      right: 26px;
      top: 100px;
      font-size: 20px;
    }

    .leaf2 {
      left: 32px;
      bottom: 122px;
      font-size: 20px;
    }

    .mini-stars {
      color: #d9b54a;
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    /* 爱心/星星飞出动画：以星星为主 */
    .floaty {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      animation: fly 1.5s ease-out forwards;
      z-index: 100;
    }

    @keyframes fly {
      0% {
        transform: translateY(0) scale(0.55) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-280px) scale(1.7) rotate(20deg);
        opacity: 0;
      }
    }

    .success-mask {
      position: fixed;
      inset: 0;
      background: rgba(248, 246, 239, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 120;
    }

    .success-card {
      width: min(90vw, 380px);
      background: #fffdf8;
      border: 3px solid #8ca378;
      border-radius: 24px;
      box-shadow: 8px 8px 0 rgba(180, 194, 159, 0.5);
      padding: 28px 22px;
      text-align: center;
    }

    .success-card h2 {
      margin: 0 0 10px;
      font-size: 28px;
      color: #5f7b46;
    }

    .success-card p {
      margin: 8px 0;
      color: #645c53;
      line-height: 1.8;
      font-size: 15px;
    }

    .success-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    .secondary-btn {
      background: #f1f4e8;
      color: #5f6d53;
      border-color: #9fb28c;
      box-shadow: 4px 4px 0 #9fb28c;
    }
  </style>
</head>
<body>

  <div class="coupon">
    <div class="doodle bow">🎀</div>
    <div class="doodle star1">⭐</div>
    <div class="doodle star2">✨</div>
    <div class="doodle star3">⭐</div>
    <div class="doodle flower1">🌼</div>
    <div class="doodle flower2">🌼</div>
    <div class="doodle leaf1">🌿</div>
    <div class="doodle leaf2">🌿</div>

    <div class="tiny">EXCLUSIVE COUPON</div>

    <div class="title">原谅券</div>

    <div class="subtitle-badge">
      ⭐ 好感 +5 ⭐
    </div>

    <div class="ribbon">限 hyn 专属使用</div>

    <div class="mini-stars">✦ ✧ ✦</div>

    <div class="description">
      恭喜获得一次专属使用机会。<br>
      使用本券后，好感度立即 <strong>+5</strong>。<br>
      搭配亲亲使用，效果更佳。
    </div>

    <div class="info-box">
      🎟 券号：YL-001<br>
      👤 使用人：hyn<br>
      🔐 状态：未核销<br>
      ⏰ 有效期：永久
    </div>

    <div class="note-box">
      备注：配合亲亲更有效哦
    </div>

    <button onclick="redeem()">
      ⭐ 确认核销
    </button>

    <div class="rule">
      本券仅限本人使用 · 不可转让<br>
      可与撒娇、抱抱、亲亲叠加使用<br>
    </div>
  </div>

  <div class="success-mask" id="successMask">
    <div class="success-card">
      <h2>核销成功 ⭐</h2>
      <p>好感度已成功增加 <strong>+5</strong></p>
      <p id="redeemTime"></p>
      <div class="success-actions">
        <button onclick="goToForm()">记录本次核销</button>
        <button class="secondary-btn" onclick="closeSuccess()">先不记录</button>
      </div>
    </div>
  </div>

  <script>
    const formLink = "https://docs.google.com/forms/d/e/1FAIpQLSe5bJym2rdEK31V1Z6I0SgeE1iXZ99zQjWnU427YYGJsN0mIA/viewform?usp=publish-editor";

    function redeem() {
      const icons = ["⭐", "✨", "🌼", "💫"];
      for (let i = 0; i < 28; i++) {
        setTimeout(() => {
          const el = document.createElement("div");
          el.className = "floaty";
          el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
          el.style.left = Math.random() * 100 + "vw";
          el.style.top = (62 + Math.random() * 24) + "vh";
          document.body.appendChild(el);

          setTimeout(() => {
            el.remove();
          }, 1500);
        }, i * 35);
      }

      setTimeout(() => {
        const now = new Date();
        const text =
          now.getFullYear() + "." +
          String(now.getMonth() + 1).padStart(2, "0") + "." +
          String(now.getDate()).padStart(2, "0") + " " +
          String(now.getHours()).padStart(2, "0") + ":" +
          String(now.getMinutes()).padStart(2, "0");

        document.getElementById("redeemTime").textContent =
          "核销时间：" + text;

        document.getElementById("successMask").style.display = "flex";
      }, 1100);
    }

    function goToForm() {
      window.location.href = formLink;
    }

    function closeSuccess() {
      document.getElementById("successMask").style.display = "none";
    }
  </script>

</body>
</html>
